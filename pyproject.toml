[project]
name = "prime-intellect-mcp"
version = "0.1.0"
description = "MCP server that lets Claude Code (and any MCP client) rent, drive, and terminate Prime Intellect GPU pods autonomously, with built-in spend caps."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Karlo Vrancic", email = "kvrancic11@gmail.com" }]
requires-python = ">=3.10,<3.14"
keywords = ["mcp", "model-context-protocol", "claude", "claude-code", "prime-intellect", "gpu", "agentic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastmcp>=2.10,<4",
  "prime>=0.5.50,<0.6",
  "pydantic>=2,<3",
]

[project.urls]
Homepage = "https://github.com/kvrancic/prime-intellect-mcp"
Repository = "https://github.com/kvrancic/prime-intellect-mcp"
Issues = "https://github.com/kvrancic/prime-intellect-mcp/issues"
Changelog = "https://github.com/kvrancic/prime-intellect-mcp/blob/main/CHANGELOG.md"

[project.scripts]
prime-intellect-mcp = "prime_intellect_mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prime_intellect_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: requires PRIME_API_KEY and will spend real money (opt in via PRIME_LIVE_TEST=1)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# E501: long lines (we use line-length=100 already)
# B008: function call in argument defaults — FastMCP uses Field() in tool signatures
# RUF001/002: × and ≤ are intentional in user-facing docstrings/messages
ignore = ["E501", "B008", "RUF001", "RUF002"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
# warn_unreachable mis-flags the double-checked-locking pattern in server.py:
# after `await lock.acquire()`, mypy keeps the pre-await type-narrow.
warn_unreachable = false
